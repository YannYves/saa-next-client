[build]
  command = "npm run build"
  publish = "out"

[build.environment]
 NODE_VERSION = "18.19.1"

# Staging environment (default)
[context.staging]
  command = "npm run build"
  environment = { DATA_SOURCE = "staging" }

# Production environment
[context.production]
  command = "npm run build"
  environment = { DATA_SOURCE = "production" }

# Branch deploy contexts
[context.branch-deploy]
  command = "npm run build"
  environment = { DATA_SOURCE = "staging" }

# Deploy preview contexts
[context.deploy-preview]
  command = "npm run build"
  environment = { DATA_SOURCE = "staging" }

[[redirects]]
  from = "/posts/*"
  to = "/posts/:splat/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/" 
  to = "/index.html"
  status = 200
  force = false
