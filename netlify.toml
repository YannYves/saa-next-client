[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20.19.2"
  NPM_FLAGS = "--legacy-peer-deps"

# Staging environment (default)
[context.staging]
  command = "npm run build"
  environment = { DATA_SOURCE = "staging" }

# Production environment
[context.production]
  command = "npm run build"
  environment = { DATA_SOURCE = "production" }

# Branch deploy contexts
[context.branch-deploy]
  command = "npm run build"
  environment = { DATA_SOURCE = "staging" }

# Deploy preview contexts
[context.deploy-preview]
  command = "npm run build"
  environment = { DATA_SOURCE = "staging" }

# Plugins
[[plugins]]
package = "@netlify/plugin-sitemap"
  [plugins.inputs]
    buildPath = "out"

[[plugins]]
package = "netlify-plugin-robots-txt"
  [plugins.inputs]
    policy = [
      { userAgent = "*", allow = "/" }
    ] 